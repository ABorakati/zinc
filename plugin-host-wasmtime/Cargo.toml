[package]
name = "zinc-plugin-host-wasmtime"
version = "0.1.0"
edition = "2021"
description = "Native Wasmtime host for Zinc WASM plugins (zinc:plugin@0.1.0), NDJSON stdio protocol"

[[bin]]
name = "zhw"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
base64 = "0.23.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
tokio = { version = "1.54.1", features = ["rt", "macros", "io-util", "io-std", "process", "sync", "time", "rt-multi-thread"] }
wasmtime = { version = "50.0.2", default-features = false, features = ["runtime", "component-model", "async", "cranelift", "parallel-compilation"] }
windows-sys = { version = "0.61.2", features = ["Win32_System_ProcessStatus", "Win32_System_Threading", "Win32_Security_Cryptography"] }

# Keep this crate out of any parent workspace.
[workspace]
