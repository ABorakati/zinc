<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <!-- Zinc app icon: original mark (not Zotero's trademark logo).
       A rounded-square tile in red with a bold geometric Z and a smaller n: Zn, zinc's chemical symbol. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#E5484D"/>
      <stop offset="1" stop-color="#B4232C"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.22"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect x="8" y="8" width="240" height="240" rx="56" fill="url(#bg)"/>
  <rect x="8" y="8" width="240" height="240" rx="56" fill="url(#shine)"/>
  <g fill="#FFFFFF" transform="translate(-7 0)">
    <!-- Z: top bar, diagonal, bottom bar -->
    <path d="M38 66 H152 L70 172 H152 V194 H38 V172 L120 88 H38 Z"/>
    <!-- n: stem and arch, x-height from 124 to the Z's baseline at 194 -->
    <path d="M164 194 V126 H184 V136 C190 128 199 124 209 124 C224 124 232 134 232 151 V194 H212 V155 C212 146 207 141 200 141 C191 141 184 148 184 157 V194 Z"/>
  </g>
</svg>
