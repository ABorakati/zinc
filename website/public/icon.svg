<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <!-- zotero-next app icon: original mark (not Zotero's trademark logo).
       A rounded-square tile in a Zotero-like red with a bold geometric Z whose
       middle stroke ends in a forward arrow ("next"). -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#E5484D"/>
      <stop offset="1" stop-color="#B4232C"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.22"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect x="8" y="8" width="240" height="240" rx="56" fill="url(#bg)"/>
  <rect x="8" y="8" width="240" height="240" rx="56" fill="url(#shine)"/>
  <!-- Z: top bar, diagonal, bottom bar -->
  <path d="M70 66 H186 L102 172 H186 V194 H70 V172 L154 88 H70 Z" fill="#FFFFFF"/>
  <!-- forward arrow on the bottom right: "next" -->
  <path d="M196 142 L222 160 L196 178 Z" fill="#FFFFFF" opacity="0.92"/>
</svg>
