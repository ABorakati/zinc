name: Desktop packages

# Zinc for Linux and macOS: an AppImage (gpui-ui/scripts/appimage.ts) and a disk image with Zinc.app (gpui-ui/scripts/dmg.ts).
#   - web-parts (Linux): the parts that are the same on every OS, built once: Zotero's document worker, the web reader page
#     (reader-host/dist, from zotero/reader at a pinned commit) and the note editor page (note-host/dist).
#   - appimage (Linux x64) and dmg (macOS, Apple Silicon): the native app (Bun executable, zn_pdf + PDFium) packaged with those parts.
# Artifacts "zinc-appimage" and "zinc-dmg" are kept for a few days. A published release, or a run by hand with release_tag, also
# attaches Zinc-<version>-x86_64.AppImage and Zinc-<version>-arm64.dmg to the release (gh workflow run desktop-packages.yml -f release_tag=v0.1.10).
# macOS minutes cost several times Linux ones on a private repository, so this runs on releases and by hand, not on every push.
# Auto-update: the builds embed the update public key and the default feed from the repository VARIABLES ZN_UPDATE_PUBKEY and
# ZN_UPDATE_URL (Settings > Secrets and variables > Actions > Variables; a public key is not a secret). Without them a build never updates.
# The dmg job also makes Zinc-<version>-arm64.app.zip, the archive the macOS updater downloads; each package gets a .version file with
# its exact build stamp. Signing the feed (latest-linux-x64.json, latest-darwin-arm64.json) is NOT done here: the private key stays on
# the release machine, where gpui-ui/scripts/release.ts signs these files (gpui-ui/UPDATES.md).
# AOT: either package can wrap the ahead-of-time compiled exe, like the Windows installer. The build runs under stable Bun and fetches the
# pinned Bun canary it needs itself (gpui-ui/scripts/_bun-canary.ts, from npm, sha512-checked). Defaults (a release has no inputs):
#   - macOS: AOT. The AOT app must also start (gpui-ui/scripts/start-check.ts: first items within 60 s). If the AOT build or that check
#     fails, the job builds the bytecode package instead and says so in a warning and the job summary, so a release is never blocked.
#   - Linux: bytecode. Bun's AOT runtime turns on memory-deny-write-execute (prctl PR_SET_MDWE) on Linux, and Mesa's software Vulkan
#     (lavapipe: VMs, WSL, machines without a GPU driver, these runners) compiles shaders to CPU code at run time, so the AOT AppImage
#     crashes there at its first frame. With a hardware Vulkan driver it should run, but that is untested. linux_build=aot builds it anyway
#     (no start check: these runners have only lavapipe).
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Attach the packages to this existing release (e.g. v0.1.10); empty: build only"
        required: false
        default: ""
      mac_build:
        description: "macOS: aot (falls back to bytecode if the AOT build or its start check fails) or bytecode"
        type: choice
        options: [aot, bytecode]
        default: aot
      linux_build:
        description: "Linux: bytecode, or aot (crashes on software Vulkan; falls back to bytecode only if the AOT build fails)"
        type: choice
        options: [bytecode, aot]
        default: bytecode

concurrency:
  group: desktop-packages-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

# The jobs that build run with a read-only token. Attaching to a release, which needs write access and the OIDC token that signs the
# provenance attestations (actions/attest-build-provenance), is done by the jobs "release-appimage" and "release-dmg", which check
# nothing out and run nothing from the repository: they take the finished files from the build job's artifact.
permissions:
  contents: read

env:
  BUN_VERSION: 1.4.5
  # zotero/reader as vendored for the app (vendor/reader; its submodules follow the commit)
  ZOTERO_READER_COMMIT: 293d7e115fd538b35dd41ffb1dc77bb9a6ff0d39 # the full commit: a short one can become ambiguous
  TAG: ${{ github.event.release.tag_name || inputs.release_tag }}
  ZN_UPDATE_PUBKEY: ${{ vars.ZN_UPDATE_PUBKEY }}
  ZN_UPDATE_URL: ${{ vars.ZN_UPDATE_URL }}
  # a release has no inputs: the defaults above
  ZN_MAC_BUILD: ${{ inputs.mac_build || 'aot' }}
  ZN_LINUX_BUILD: ${{ inputs.linux_build || 'bytecode' }}

defaults:
  run:
    shell: bash

jobs:
  web-parts:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Cache Zotero's document worker
        id: docworker
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: vendor/document-worker
          key: docworker-${{ hashFiles('scripts/build-docworker.sh') }}
      - name: Build Zotero's document worker
        if: steps.docworker.outputs.cache-hit != 'true'
        run: mkdir -p vendor && bash scripts/build-docworker.sh
      - name: Cache the web reader
        id: reader
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            vendor/reader
            reader-host/dist
          key: reader-${{ env.ZOTERO_READER_COMMIT }}-${{ hashFiles('reader-host/**', 'scripts/shims/**') }}
      - name: Build the web reader page
        if: steps.reader.outputs.cache-hit != 'true'
        run: |
          git clone --recurse-submodules https://github.com/zotero/reader vendor/reader
          git -C vendor/reader checkout "$ZOTERO_READER_COMMIT"
          git -C vendor/reader submodule update --init --recursive
          bash reader-host/build.sh
      - name: Build the note editor page
        run: bash note-host/build.sh
      - name: Keep the parts
        run: |
          mkdir -p parts
          tar -czf parts/web-parts.tgz vendor/document-worker/build vendor/reader/structured-document-text/src reader-host/dist note-host/dist
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: web-parts
          path: parts/web-parts.tgz
          retention-days: 1

  appimage:
    needs: web-parts
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: web-parts
      - name: Unpack the parts
        run: tar -xzf web-parts.tgz
      - name: Install core and gpui-ui
        run: |
          (cd core && bun install --frozen-lockfile)
          (cd gpui-ui && bun install --frozen-lockfile)
      - name: Fetch vendored Zotero translation code
        run: bun core/scripts/fetch-zotero-vendor.ts
      - name: Placeholder for the fulltext wasm
        run: |
          mkdir -p core/vendor/fulltext-wasm
          touch core/vendor/fulltext-wasm/fulltext.wasm
      - name: Cache the Bun canary (AOT)
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: gpui-ui/out/tools/bun-*
          key: bun-canary-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('gpui-ui/scripts/_bun-canary.ts') }}
      - name: AppImage
        working-directory: gpui-ui
        run: |
          export ZN_RELEASE="${TAG#v}"; [ -n "$ZN_RELEASE" ] || export ZN_RELEASE=0.1.0 # v0.1.10 -> 0.1.10
          if [ "$ZN_LINUX_BUILD" = aot ] && bun scripts/appimage.ts --aot; then
            echo "AppImage: **AOT** build (not start-checked)" >> "$GITHUB_STEP_SUMMARY"
          else
            [ "$ZN_LINUX_BUILD" = aot ] && echo "::warning title=AOT build failed::the AppImage is the bytecode build instead (see the log above)"
            bun scripts/appimage.ts
            echo "AppImage: bytecode build" >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: zinc-appimage
          path: |
            gpui-ui/out/appimage/*.AppImage
            gpui-ui/out/appimage/*.sha256
            gpui-ui/out/appimage/*.version

  # Attaches the AppImage to the release (see the note at the top about permissions).
  release-appimage:
    needs: appimage
    if: github.event_name == 'release' || inputs.release_tag != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write # gh release upload
      id-token: write # the OIDC token that signs the provenance attestation
      attestations: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: zinc-appimage
          path: pkg
      # a signed statement that this AppImage was built by this workflow from this commit: `gh attestation verify <file> -R ABorakati/zinc`
      - name: Attest build provenance
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-path: pkg/*.AppImage
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release upload "$TAG" pkg/*.AppImage pkg/*.AppImage.sha256 pkg/*.AppImage.version --clobber

  dmg:
    needs: web-parts
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: web-parts
      - name: Unpack the parts
        run: tar -xzf web-parts.tgz
      - name: Install core and gpui-ui
        run: |
          (cd core && bun install --frozen-lockfile)
          (cd gpui-ui && bun install --frozen-lockfile)
      - name: Fetch vendored Zotero translation code
        run: bun core/scripts/fetch-zotero-vendor.ts
      - name: Placeholder for the fulltext wasm
        run: |
          mkdir -p core/vendor/fulltext-wasm
          touch core/vendor/fulltext-wasm/fulltext.wasm
      - name: Cache the Bun canary (AOT)
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: gpui-ui/out/tools/bun-*
          key: bun-canary-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('gpui-ui/scripts/_bun-canary.ts') }}
      - name: Disk image
        working-directory: gpui-ui
        run: |
          export ZN_RELEASE="${TAG#v}"; [ -n "$ZN_RELEASE" ] || export ZN_RELEASE=0.1.0 # v0.1.10 -> 0.1.10
          # the AOT package is built and start-checked first; only then wrapped (dmg.ts --no-package --package <it>)
          if [ "$ZN_MAC_BUILD" = aot ] && bun scripts/package.ts --aot && bun scripts/start-check.ts out/package-aot/zotero-next-gpui \
            && bun scripts/dmg.ts --aot --no-package; then
            echo "Disk image: **AOT** build (start-checked)" >> "$GITHUB_STEP_SUMMARY"
          else
            [ "$ZN_MAC_BUILD" = aot ] && echo "::warning title=AOT build failed::the disk image is the bytecode build instead (see the log above)"
            bun scripts/dmg.ts
            echo "Disk image: bytecode build" >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: zinc-dmg
          path: |
            gpui-ui/out/dmg/*.dmg
            gpui-ui/out/dmg/*.app.zip
            gpui-ui/out/dmg/*.sha256
            gpui-ui/out/dmg/*.version

  # Attaches the disk image and the app.zip the macOS updater downloads to the release (see the note at the top about permissions).
  release-dmg:
    needs: dmg
    if: github.event_name == 'release' || inputs.release_tag != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write # gh release upload
      id-token: write # the OIDC token that signs the provenance attestations
      attestations: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: zinc-dmg
          path: pkg
      # the disk image and the app.zip the macOS updater downloads: `gh attestation verify <file> -R ABorakati/zinc`
      - name: Attest build provenance
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-path: |
            pkg/*.dmg
            pkg/*.app.zip
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release upload "$TAG" pkg/*.dmg pkg/*.app.zip pkg/*.sha256 pkg/*.version --clobber
