name: Browser extension

# Builds the Zinc Connector, the browser extension (a Zotero Connector fork, repo ABorakati/zinc-connector), with the Zinc app as
# its library tab (WebAssembly). Not to be confused with web.yml, which builds the website's read-only demo of the app: that one has a
# demo library and no extension. This one builds the library page for the extension (gpui-ui/web/build.ts --target extension) and
# packs it into the connector (scripts/package.ts in the connector repo).
#   - every run: the unpacked zip as the artifact "zinc-connector-unpacked" (unzip it, then "Load unpacked" in chrome://extensions).
#   - a published release (or release_tag by hand, for a release that exists): also Zinc-Connector-<version>.zip and
#     Zinc-Connector-<version>-store.zip, attached to the release. The version comes from the tag: v0.2.0 -> 0.2.0, v0.2.0-beta.1 ->
#     manifest version 0.2.0.1 with version_name 0.2.0-beta.1. Nothing is uploaded to the Chrome Web Store or Edge Add-ons: the
#     store zip is uploaded by hand (docs/developer-guide/extension-release.md).
# ABorakati/zinc-connector is public, so no secret is needed. If it is made private again, add the secret CONNECTOR_REPO_TOKEN: a
# fine-grained token with read-only "Contents" on it.
# The runner is Windows: scripts/build-win.ts is the connector build without build.sh's Unix tools, and it is the one that has been run
# (on Windows). It needs only Bun, and a checkout of both repositories side by side (zotero-next and zinc-connector).
on:
  push:
    branches: [main]
    paths:
      - "gpui-ui/**"
      - "core/**"
      - "connector-host/**"
      - "reader-host/**"
      - ".github/workflows/extension.yml"
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Attach the zips to this existing release (e.g. v0.2.0); empty: build only"
        required: false
        default: ""

concurrency:
  # per event: a tag's push run must not cancel the release run of the same tag (which attaches the zips)
  group: extension-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  BUN_VERSION: 1.4.5

defaults:
  run:
    shell: bash

jobs:
  extension:
    runs-on: windows-latest
    timeout-minutes: 60
    # Read-only token (the workflow's default): this job runs code from two repositories and from downloaded packages. Attaching the
    # zips to a release, which needs write access, is the job "release" below, and it only receives the finished zips.
    outputs:
      tag: ${{ steps.pkg.outputs.tag }}
    steps:
      - name: Check out zotero-next
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          path: zotero-next

      - name: Check out the connector
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          repository: ABorakati/zinc-connector
          ref: zotero-next
          submodules: true
          # the repository is public; CONNECTOR_REPO_TOKEN is only needed if it is made private again
          token: ${{ secrets.CONNECTOR_REPO_TOKEN || github.token }}
          path: zinc-connector

      # The connector is taken at the tip of its branch zotero-next on purpose: a release of the extension is built from whatever the
      # owner last pushed there, and pinning a commit here would mean editing this file before every release. The commit that was
      # built is recorded in the job summary, and the credentials are not left in the checkout.
      - name: Record the connector commit
        run: |
          echo "Connector commit: $(git -C zinc-connector rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"

      - name: Check the connector checkout
        run: |
          for f in zinc-connector/scripts/package.ts zinc-connector/scripts/build-win.ts zinc-connector/src/zotero/chrome/skin; do
            [ -e "$f" ] || { echo "::error title=Connector checkout incomplete::$f is missing: branch zotero-next of ABorakati/zinc-connector has no scripts/package.ts yet, or its submodules did not come with it."; exit 1; }
          done
      # The update notice's public key. Without it the build (a release too, like the app's own builds) shows no update notice, with a
      # warning; commit gpui-ui/update-pubkey.txt (gpui-ui/UPDATES.md) so releases get one.
      - name: Check the update public key
        run: |
          if [ -s zotero-next/gpui-ui/update-pubkey.txt ]; then
            echo "ZN_UPDATE_PUBKEY_FILE=$GITHUB_WORKSPACE/zotero-next/gpui-ui/update-pubkey.txt" >> "$GITHUB_ENV"
            exit 0
          fi
          echo "::warning title=No update public key::gpui-ui/update-pubkey.txt is missing: this build shows no update notice (gpui-ui/UPDATES.md)."
          echo "ZN_ALLOW_NO_UPDATE_KEY=1" >> "$GITHUB_ENV"

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Cache bun packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.bun/install/cache
          key: bun-ext-${{ runner.os }}-${{ hashFiles('zotero-next/core/bun.lock', 'zotero-next/gpui-ui/bun.lock', 'zinc-connector/bun.lock') }}
          restore-keys: bun-ext-${{ runner.os }}-

      - name: Install core, gpui-ui and the connector
        run: |
          (cd zotero-next/core && bun install --frozen-lockfile)
          (cd zotero-next/gpui-ui && bun install --frozen-lockfile)
          (cd zinc-connector && bun install --frozen-lockfile)

      # core/vendor is git-ignored; same pinned download as web.yml and ci.yml.
      - name: Cache vendored Zotero translation code
        id: vendor
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: zotero-next/core/vendor/zotero
          key: zotero-vendor-${{ hashFiles('zotero-next/core/scripts/fetch-zotero-vendor.ts') }}
      - name: Fetch vendored Zotero translation code
        if: steps.vendor.outputs.cache-hit != 'true'
        working-directory: zotero-next
        run: bun core/scripts/fetch-zotero-vendor.ts

      # The full-text engine is built in a separate private repo (see ci.yml): a placeholder lets the build resolve.
      - name: Placeholder for the fulltext wasm
        working-directory: zotero-next
        run: |
          mkdir -p core/vendor/fulltext-wasm
          [ -s core/vendor/fulltext-wasm/fulltext.wasm ] || : > core/vendor/fulltext-wasm/fulltext.wasm

      # The reader tab (EPUBs and web snapshots) is the Zotero reader plus its host page: reader-host/dist, built by
      # reader-host/build.sh from vendor/reader and vendor/document-worker. Both are git-ignored upstream clones.
      - name: Cache the Zotero reader and document worker
        id: reader
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            zotero-next/vendor/reader
            zotero-next/vendor/document-worker
          key: zotero-reader-${{ hashFiles('zotero-next/reader-host/build.sh', 'zotero-next/scripts/build-docworker.sh') }}
      - name: Fetch and build the Zotero reader and the document worker
        if: steps.reader.outputs.cache-hit != 'true'
        working-directory: zotero-next
        run: |
          bash scripts/build-docworker.sh # the reader host needs vendor/document-worker/build/worker.js
          bash reader-host/build.sh # fetches zotero/reader at READER_COMMIT into vendor/reader and builds vendor/reader/build/web
      - name: Reader host page
        if: steps.reader.outputs.cache-hit == 'true'
        working-directory: zotero-next
        run: bash reader-host/build.sh --skip-reader

      - name: Build the library page
        working-directory: zotero-next/gpui-ui
        run: bun web/build.ts --target extension --reader ../reader-host/dist

      - name: Package the connector
        id: pkg
        env:
          TAG: ${{ github.event.release.tag_name || inputs.release_tag }}
        working-directory: zinc-connector
        run: |
          # no release: a throw-away pre-release version, so the artifact's manifest says which run built it
          [ -n "$TAG" ] || TAG="v0.0.0-ci.$GITHUB_RUN_NUMBER"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          bun scripts/package.ts --tag "$TAG" --library ../zotero-next/gpui-ui/dist-extension --out ../ext-out
          ls -l ../ext-out

      - name: Upload the unpacked zip
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: zinc-connector-unpacked
          path: |
            ext-out/*.zip
            !ext-out/*-store.zip
          retention-days: 7
          if-no-files-found: error

      - name: Keep the zips for the release job
        if: github.event_name == 'release' || inputs.release_tag != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: zinc-connector-zips
          path: ext-out/*.zip
          retention-days: 1
          if-no-files-found: error

  # Attaches both zips to the release. It does not check anything out and runs nothing from the repository or the connector: it takes
  # the artifact, signs a statement of where it came from, and uploads it.
  release:
    needs: extension
    if: github.event_name == 'release' || inputs.release_tag != ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # gh release upload
      id-token: write # build provenance attestations of the zips
      attestations: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: zinc-connector-zips
          path: ext-out
      # a signed statement that these zips were built by this workflow from this commit: `gh attestation verify <zip> -R ABorakati/zinc`
      - name: Attest build provenance
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-path: ext-out/*.zip
      - name: Attach both zips to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.extension.outputs.tag }}
        run: gh release upload "$TAG" ext-out/*.zip --clobber --repo "$GITHUB_REPOSITORY"
