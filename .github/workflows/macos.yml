name: macOS

# Zinc on macOS (Apple Silicon): core's tests, the app's typecheck and logic tests, the native PDF library (native/pdf as a .dylib with
# PDFium), and a smoke run of the real app window (gpui-ui/scripts/smoke-native.ts) whose screenshots are kept as an artifact.
# Runs on demand, on pull requests, and on pushes to main whenever the code that differs per operating system changes, rather than on
# every push.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/macos.yml"
      - "gpui-ui/native/**"
      - "gpui-ui/src/webview/**"
      - "gpui-ui/src/shell/**"
      - "gpui-ui/src/reader/pdf.ts"
      - "gpui-ui/src/reader/printGtk.ts"
      - "gpui-ui/src/reader/printMac.ts"
      - "gpui-ui/scripts/smoke-native.ts"
      - "gpui-ui/package.json"
      - "gpui-ui/bun.lock"
      - "core/src/platform-dirs.ts"
      - "core/src/library-location.ts"
  pull_request:
    paths:
      - ".github/workflows/macos.yml"
      - "gpui-ui/native/**"
      - "gpui-ui/src/webview/**"
      - "gpui-ui/src/shell/**"
      - "gpui-ui/src/reader/pdf.ts"
      - "gpui-ui/src/reader/printGtk.ts"
      - "gpui-ui/src/reader/printMac.ts"
      - "gpui-ui/scripts/smoke-native.ts"
      - "gpui-ui/package.json"
      - "gpui-ui/bun.lock"
      - "core/src/platform-dirs.ts"
      - "core/src/library-location.ts"

concurrency:
  group: macos-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  BUN_VERSION: 1.4.4

defaults:
  run:
    shell: bash

jobs:
  macos:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Cache bun packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('core/bun.lock', 'gpui-ui/bun.lock', 'word/sidebar/bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - name: Install core
        working-directory: core
        run: bun install --frozen-lockfile
      - name: Install gpui-ui
        working-directory: gpui-ui
        run: bun install --frozen-lockfile
      # core/test/fuzz/docfields.fuzz.test.ts imports word/sidebar/src
      - name: Install word/sidebar
        working-directory: word/sidebar
        run: bun install --frozen-lockfile
      # the WASM plugin tests (gpui-ui/src/wasmplugins) build a fixture plugin with plugin-host's componentize-qjs
      - name: Install plugin-host
        working-directory: plugin-host
        run: bun install --frozen-lockfile

      # See ci.yml for both.
      - name: Cache vendored Zotero translation code
        id: vendor
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: core/vendor/zotero
          key: zotero-vendor-${{ hashFiles('core/scripts/fetch-zotero-vendor.ts') }}
      - name: Fetch vendored Zotero translation code
        if: steps.vendor.outputs.cache-hit != 'true'
        run: bun core/scripts/fetch-zotero-vendor.ts
      - name: Placeholder for the fulltext wasm
        run: |
          mkdir -p core/vendor/fulltext-wasm
          [ -s core/vendor/fulltext-wasm/fulltext.wasm ] || : > core/vendor/fulltext-wasm/fulltext.wasm

      - name: core typecheck
        working-directory: core
        run: bun check
      - name: core test
        working-directory: core
        run: bun test --timeout 30000

      - name: gpui-ui typecheck
        working-directory: gpui-ui
        run: bun check
      - name: gpui-ui test
        working-directory: gpui-ui
        run: bun test --timeout 30000

      # native/pdf: libzn_pdf.dylib, and the pinned PDFium build for macOS arm64 (sha256-checked by the script)
      - name: Cache cargo
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            gpui-ui/native/pdf/target
          key: cargo-${{ runner.os }}-${{ hashFiles('gpui-ui/native/pdf/Cargo.lock', 'gpui-ui/native/pdf/src/**') }}
          restore-keys: cargo-${{ runner.os }}-
      - name: Build native/pdf
        working-directory: gpui-ui/native/pdf
        run: cargo build --release
      - name: Fetch PDFium
        run: bun gpui-ui/native/pdf/vendor/fetch-pdfium.ts

      # The real window: the library list, then the demo PDF in a reader tab. Fails when either does not come up.
      - name: Smoke run of the app
        working-directory: gpui-ui
        timeout-minutes: 6 # a hang (a modal loop, a blocked native call) must not burn the job's 40 minutes
        run: bun scripts/smoke-native.ts "$RUNNER_TEMP/smoke"
      - name: Keep the screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: macos-smoke
          path: ${{ runner.temp }}/smoke
          if-no-files-found: warn
