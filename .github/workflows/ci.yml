name: CI

# Tests, typecheck and the (quick) fuzz suite on every push and pull request.
# The long fuzz run is fuzz-nightly.yml. How to run the same steps locally: CONTRIBUTING.md.
on:
  push:
  pull_request:
  workflow_dispatch:

# A newer push to the same branch / PR cancels the run in progress.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  BUN_VERSION: 1.4.4

defaults:
  run:
    shell: bash

jobs:
  # core/: the library service. Includes the fuzz suite (core/test/fuzz, ~150 cases per property by default).
  core:
    name: core (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Cache bun packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('core/bun.lock', 'word/sidebar/bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      # core/test/fuzz/docfields.fuzz.test.ts imports word/sidebar/src, so the sidebar's packages are installed too.
      - name: Install core
        working-directory: core
        run: bun install --frozen-lockfile
      - name: Install word/sidebar
        working-directory: word/sidebar
        run: bun install --frozen-lockfile

      # core/vendor is git-ignored. The script downloads the commits pinned in its PINS table, so the cache key is the script.
      - name: Cache vendored Zotero translation code
        id: vendor
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: core/vendor/zotero
          key: zotero-vendor-${{ hashFiles('core/scripts/fetch-zotero-vendor.ts') }}
      - name: Fetch vendored Zotero translation code
        if: steps.vendor.outputs.cache-hit != 'true'
        run: bun core/scripts/fetch-zotero-vendor.ts

      # core/src/fulltext/wasm.ts imports core/vendor/fulltext-wasm/fulltext.wasm, which is built in a separate private repo and is
      # not available here. A zero-byte placeholder lets the module graph resolve; the tests that need the real engine skip
      # (core/test/needs.ts: HAVE_FULLTEXT_WASM).
      - name: Placeholder for the fulltext wasm
        run: |
          mkdir -p core/vendor/fulltext-wasm
          [ -s core/vendor/fulltext-wasm/fulltext.wasm ] || : > core/vendor/fulltext-wasm/fulltext.wasm

      - name: Typecheck (bun check)
        working-directory: core
        run: bun check

      # --timeout: a few translator tests copy ~750 files and take longer than bun's 5 s default on a cold Windows runner.
      - name: Test
        working-directory: core
        run: bun test --timeout 30000

  # gpui-ui/ (native app: pure-logic tests only), word/sidebar and word/addin. Windows: the add-in is .NET Framework 4.8 + WinForms.
  windows-rest:
    name: gpui-ui, word (windows-latest)
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Cache bun packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-rest-${{ hashFiles('gpui-ui/bun.lock', 'core/bun.lock', 'word/sidebar/bun.lock') }}
          restore-keys: bun-${{ runner.os }}-rest-

      - name: Install gpui-ui
        working-directory: gpui-ui
        run: bun install --frozen-lockfile
      # word/sidebar's tests import core/src/cite (citeproc and friends come from core's packages)
      - name: Install core
        working-directory: core
        run: bun install --frozen-lockfile
      - name: Install word/sidebar
        working-directory: word/sidebar
        run: bun install --frozen-lockfile
      # the WASM plugin tests (gpui-ui/src/wasmplugins) build a fixture plugin with plugin-host's componentize-qjs
      - name: Install plugin-host
        working-directory: plugin-host
        run: bun install --frozen-lockfile

      # The *.test.ts files under gpui-ui/src are pure logic (they do not open the @gpuix native addon or a window).
      # The screenshot scripts (gpui-ui/scripts/shot-*.tsx) need a GPU and are not run here.
      - name: gpui-ui typecheck
        working-directory: gpui-ui
        run: bun check
      # wasmplugins/ui/dialogMount.test.ts builds a real plugin to WebAssembly
      - name: Rust target for plugins
        run: rustup target add wasm32-wasip2
      - name: gpui-ui test
        working-directory: gpui-ui
        run: bun test --timeout 30000

      # The Word end-to-end tests skip themselves when Word is not installed.
      - name: word/sidebar typecheck
        working-directory: word/sidebar
        run: bun check
      - name: word/sidebar test
        working-directory: word/sidebar
        run: bun test

      # Into a temp folder: the project's own OutputPath is word/dist/addin.
      - name: word/addin build (.NET Framework 4.8)
        run: dotnet build word/addin/ZoteroNextWord.csproj -c Release -nologo -v q -o "$RUNNER_TEMP/addin-out"

  # The UI harness (gpui-ui/test/ui): the real app on GPUI's test renderer, driven through hit testing and key dispatch. Windows:
  # that renderer does not exist for Linux. The reader scenarios need zn_pdf and the document worker, so both are built here.
  ui:
    name: UI harness (windows-latest)
    runs-on: windows-latest
    timeout-minutes: 100 # two scenarios at a time on a 4-core runner, about four times a run of eight
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Cache bun packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-ui-${{ hashFiles('gpui-ui/bun.lock', 'core/bun.lock', 'gpui-ui/patches/**') }}
          restore-keys: bun-${{ runner.os }}-ui-

      - name: Install gpui-ui
        working-directory: gpui-ui
        run: bun install --frozen-lockfile
      - name: Install core
        working-directory: core
        run: bun install --frozen-lockfile
      - name: Fetch the vendored Zotero code
        run: bun core/scripts/fetch-zotero-vendor.ts
      - name: Placeholder for the full-text engine
        shell: bash
        run: mkdir -p core/vendor/fulltext-wasm && touch core/vendor/fulltext-wasm/fulltext.wasm

      - name: Cache cargo
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            gpui-ui/native/pdf/target
          key: cargo-ui-${{ runner.os }}-${{ hashFiles('gpui-ui/native/pdf/Cargo.lock', 'gpui-ui/native/pdf/src/**') }}
          restore-keys: cargo-ui-${{ runner.os }}-
      - name: Build the PDF library
        working-directory: gpui-ui/native/pdf
        run: cargo build --release --locked
      - name: Fetch PDFium
        run: bun gpui-ui/native/pdf/vendor/fetch-pdfium.ts

      - name: Cache the document worker
        id: docworker
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: vendor/document-worker
          key: docworker-ui-${{ runner.os }}-${{ hashFiles('scripts/build-docworker.sh') }}
      - name: Build the document worker
        if: steps.docworker.outputs.cache-hit != 'true'
        shell: bash
        run: mkdir -p vendor && bash scripts/build-docworker.sh # vendor/ is git-ignored, so a fresh checkout has none

      # The runner's screen is 1024 x 768 and Windows shrinks a larger window to fit it; the scenarios need 1440 x 900.
      - name: Display large enough for the test window
        shell: pwsh
        run: |
          Set-DisplayResolution -Width 1920 -Height 1080 -Force
          Add-Type -AssemblyName System.Windows.Forms
          [System.Windows.Forms.Screen]::PrimaryScreen.Bounds | Format-List Width, Height
      # In-process: CI does not build the packaged app (the AOT build and the release renderer). The packaged app is tested before a
      # release instead: scripts/release.ts refuses an installer without a passing default run of its package (docs/developer-guide/testing.md).
      - name: UI scenarios
        working-directory: gpui-ui
        run: bun run test:ui --in-process
      - name: Keep the evidence of failures
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ui-test-failures
          path: gpui-ui/out/ui-test
          retention-days: 7

  # gpui-ui/src/shell/appearance.ts on Linux: the light/dark reader and change monitor, which run gdbus against the XDG desktop
  # portal. appearance.linux.test.ts starts a private dbus-daemon and a stand-in portal (Python Gio); ZN_PORTAL_TEST=1 makes those
  # tests fail, instead of skip, when dbus-daemon, gdbus or PyGObject is missing. The other gpui-ui tests run in windows-rest.
  linux-appearance:
    name: gpui-ui appearance (ubuntu-latest)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Cache bun packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-gpui-${{ hashFiles('gpui-ui/bun.lock') }}
          restore-keys: bun-${{ runner.os }}-gpui-

      - name: Install gpui-ui
        working-directory: gpui-ui
        run: bun install --frozen-lockfile
      - name: Install dbus-daemon, gdbus and PyGObject
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends dbus-daemon libglib2.0-bin python3-gi

      - name: gpui-ui appearance test
        working-directory: gpui-ui
        env:
          ZN_PORTAL_TEST: "1"
        run: bun test src/shell/appearance.linux.test.ts

  # Commit messages (CONTRIBUTING.md, "Commit messages"): the rules' tests on every push; on a pull request, also its title and each
  # of its commits, merges excepted. The commit-msg hook in .githooks runs the same script before a commit is made.
  commit-messages:
    name: commit messages
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Test the rules
        run: bun test scripts/commit-lint.test.ts
      # The workflows' own rules (pinned actions, read-only tokens, the release hand-off): scripts/workflows.test.ts
      - name: Test the workflows
        run: bun test scripts/workflows.test.ts
      # The title and the shas go through env: a title is text anyone opening a pull request can choose.
      - name: Check the pull request's title and commits
        if: github.event_name == 'pull_request'
        env:
          TITLE: ${{ github.event.pull_request.title }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          status=0
          bun scripts/commit-lint.ts --message "$TITLE" || status=1
          bun scripts/commit-lint.ts "$BASE..$HEAD" || status=1
          exit $status
