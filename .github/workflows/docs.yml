name: Docs

# Builds the documentation site (website/, which renders docs/) to catch broken links, pages and Mermaid/Markdown errors.
# It does NOT deploy anything: the site is for local use (bun run docs:dev / docs:preview). The built site is kept as a
# workflow artifact for a few days so it can be downloaded and opened, nothing more.
on:
  push:
    paths:
      - "docs/**"
      - "website/**"
      - "gpui-ui/assets/**"
      - "word/sidebar/**"
      - "core/src/cite/**"
      - ".github/workflows/docs.yml"
  pull_request:
    paths:
      - "docs/**"
      - "website/**"
      - "gpui-ui/assets/**"
      - "word/sidebar/**"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  BUN_VERSION: 1.4.5
  DOCS_BASE: /

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
        working-directory: website
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install
        run: bun install --frozen-lockfile

      # the asset sync builds the Word sidebar demo from word/sidebar, which pulls in core's citation code (citeproc from
      # core/node_modules). The app demo needs gpui-ui and is built by web.yml; here the sync skips it.
      - name: Install core and word/sidebar
        working-directory: .
        run: |
          (cd core && bun install --frozen-lockfile)
          (cd word/sidebar && bun install --frozen-lockfile)

      - name: Build (fails on a broken docs link)
        run: bun run build

      - name: Upload the built site
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: docs-site
          path: website/dist
          retention-days: 3
          if-no-files-found: error
